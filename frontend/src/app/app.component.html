<ion-app>
  <ion-split-pane contentId="main-content" [disabled]="esLogin" when="xs">
   @if (!esLogin) {
    <ion-menu contentId="main-content" type="overlay">

      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Gym Manager</ion-list-header>
          <ion-note>hi&#64;pesguicom.com.ar</ion-note>

          @for (p of appPages; track p.url) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item button lines="none" (click)="cerrarSesion()">
              <ion-icon name="log-out-outline" slot="start"></ion-icon>
              <ion-label>Cerrar sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

      </ion-content>
    </ion-menu>
  }
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
