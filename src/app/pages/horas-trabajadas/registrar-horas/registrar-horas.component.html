<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registrar horas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card class="ion-margin-top">

    <ion-card-header>
      <ion-card-title>⏱️ Registrar horas trabajadas</ion-card-title>
    </ion-card-header>

    <ion-card-content (keydown.enter)="agregarHora()">

      <!--PROFESOR-->
      <ion-item>
        <ion-label>Profesor</ion-label>
        <ion-select [(ngModel)]="profesorId" placeholder="Seleccionar profesor">

          @for (profesor of profesores; track profesor.id) {

            <ion-select-option [value]="profesor.id">{{ profesor.nombre }}</ion-select-option>
          }

        </ion-select>
      </ion-item>

      <!--FECHA-->
      <ion-item>
        <ion-label position="stacked">Fecha</ion-label>

        <ion-input type="date" [(ngModel)]="fecha"></ion-input>
      </ion-item>

      <!--HORA INICIO-->
      <ion-item>
        <ion-label position="stacked">Hora de inicio</ion-label>

        <ion-input type="time" [(ngModel)]="horaInicio" (ionInput)="calcularHoras()"></ion-input>
      </ion-item>

      <!--HORA FIN-->
      <ion-item>
        <ion-label position="stacked">Hora de fin</ion-label>

        <ion-input type="time" [(ngModel)]="horaFin" (ionInput)="calcularHoras()"></ion-input>
      </ion-item>

      <!-- HORAS CALCULADAS -->
      <ion-item>
        <ion-label position="stacked">Horas trabajadas</ion-label>

        <ion-input type="number" [value]="horas" readonly></ion-input>
      </ion-item>


      <!-- ACTIVIDAD -->
      <ion-item>
        <ion-label position="stacked">Actividad</ion-label>

        <ion-input type="text" [(ngModel)]="actividad" placeholder="Ej: Musculación">
        </ion-input>
      </ion-item>


      <!-- OBSERVACIÓN -->
      <ion-item>
        <ion-label position="stacked">Observación</ion-label>

        <ion-input type="text" [(ngModel)]="observacion" placeholder="Ej: Turno mañana">
        </ion-input>
      </ion-item>


      <!-- BOTÓN -->
      <ion-button expand="block" color="success" class="ion-margin-top" (click)="agregarHora()">
           💾 Guardar horas
      </ion-button>


    </ion-card-content>

  </ion-card>
</ion-content>
