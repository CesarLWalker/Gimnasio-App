<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Clientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-searchbar placeholder="Buscar Cliente" [(ngModel)]="searchTerm" (ionInput)="filterClients()"></ion-searchbar>

<ion-content class="ion-padding">
  <ion-list>
  @for (cliente of clientesFiltrados; track cliente.id) {

    <ion-card>
      <ion-card-header>
        <ion-card-title> 👤 {{ cliente.nombre }} </ion-card-title>
      </ion-card-header>


    <ion-card-content>
      <ion-item lines="none">
        <ion-label>Estado: {{ cliente.estado }} </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label>Fecha de Pago: {{ cliente.fechaPago }} </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label>Cuota: {{ cliente.cuota }} </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label>Monto: $ {{ cliente.monto }}</ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label>Tipo de Pago: {{ cliente.tipoPago }}</ion-label>
      </ion-item>
      <ion-item line="none">
        <ion-label>Celular: 📱{{ cliente.celular }}</ion-label>
      </ion-item>

    </ion-card-content>
    </ion-card>
  }

  </ion-list>
  
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="goToNuevoCliente()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
 
</ion-content>
